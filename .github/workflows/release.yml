name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build & upload release artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
              ~/.cargo/registry
              ~/.cargo/git
              target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
              ${{ runner.os }}-cargo-${{ matrix.target }}-
              ${{ runner.os }}-cargo-

      - name: Install GTK4 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            build-essential \
            pkg-config

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p release-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/netspecter release-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/netspecter-agent release-${{ matrix.target }}/
          cp -r templates release-${{ matrix.target }}/ || true
          cp README.md LICENSE NOTICE.md release-${{ matrix.target }}/
          cd release-${{ matrix.target }}
          tar czf ../netspecter-${{ matrix.target }}.tar.gz *

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            netspecter-${{ matrix.target }}.tar.gz
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true

  verify:
    name: Run test suite on tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
              ~/.cargo/registry
              ~/.cargo/git
              target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Install GTK4 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential pkg-config
      - name: cargo test
        run: cargo test --workspace --no-fail-fast