[workspace]
resolver = "2"
members = ["crates/common", "crates/agent", "crates/gui", "crates/cli"]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["AbD02018 <ana.abdo2013@gmail.com>"]
homepage = "https://github.com/AbD02018/NetSpecter"
repository = "https://github.com/AbD02018/NetSpecter"
documentation = "https://github.com/AbD02018/NetSpecter/wiki"
readme = "README.md"

[workspace.dependencies]
netspecter-common = { path = "crates/common", version = "2.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
nix = { version = "0.31", features = ["signal", "socket", "user", "fs"] }
which = "8"
lazy_static = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = "0.13"
handlebars = "6"
printpdf = "0.7"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
askama = "0.12"

[workspace.metadata]